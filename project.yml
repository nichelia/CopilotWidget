name: CopilotWidget

options:
  bundleIdPrefix: com.nichelia
  deploymentTarget:
    macOS: "26.2"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: V7WWTGPQT3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  CopilotWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nichelia.CopilotWidget
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/CopilotWidget.entitlements
        # Sandboxed: unlike Cursor/Claude widgets this reads no other app's credentials.
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: CopilotWidgetExtension
        embed: true

  CopilotWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nichelia.CopilotWidget.WidgetExtension
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/CopilotWidgetExtension.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
